<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書店多分店進銷存系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border p-6">
    
    <!-- 頂部 Header -->
    <div class="flex justify-between items-center pb-6 border-b">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-bold text-slate-900">📚 書店多分店進銷存系統</h1>
        <span class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-full font-medium">內部專用</span>
      </div>
      <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800 border px-3 py-1.5 rounded-lg">登出系統</button>
    </div>

    <!-- 數據概覽 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-6">
      <div class="bg-blue-50/50 border border-blue-100 rounded-xl p-4">
        <p class="text-xs text-slate-500 font-medium">現有庫存 (在地)</p>
        <p id="statStock" class="text-2xl font-bold text-blue-900 mt-1">0 本</p>
      </div>
      <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4">
        <p class="text-xs text-slate-500 font-medium">累計售出本數</p>
        <p id="statSold" class="text-2xl font-bold text-emerald-900 mt-1">0 本</p>
      </div>
      <div class="bg-amber-50/50 border border-amber-100 rounded-xl p-4">
        <p class="text-xs text-slate-500 font-medium">總銷售金額 (HKD)</p>
        <p id="statRevenue" class="text-2xl font-bold text-amber-900 mt-1">$ 0</p>
      </div>
    </div>

    <!-- 進貨與搜尋區 -->
    <div class="bg-slate-50 p-5 rounded-xl border mb-8">
      <h2 class="text-sm font-bold text-slate-700 mb-3">進貨與書籍搜尋</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <!-- 1. ISBN 搜尋 -->
        <div>
          <label class="text-xs font-semibold text-slate-500 mb-1 block">1. ISBN 條碼搜尋：</label>
          <div class="flex gap-2">
            <input type="text" id="isbnInput" placeholder="輸入或掃描 ISBN" class="w-full text-sm p-2.5 border rounded-lg">
            <button onclick="searchISBN()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-blue-700 whitespace-nowrap">搜尋</button>
          </div>
        </div>

        <!-- 2. 相片封面尋書 -->
        <div>
          <label class="text-xs font-semibold text-slate-500 mb-1 block">2. 📸 拍照/上傳封面找書：</label>
          <label class="flex items-center justify-center bg-indigo-600 text-white px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 cursor-pointer w-full text-center">
            📸 拍照/上傳封面
            <input type="file" accept="image/*" class="hidden" onchange="handleCoverSearch(event)">
          </label>
        </div>

        <!-- 3. 相機掃碼 -->
        <div>
          <label class="text-xs font-semibold text-slate-500 mb-1 block">3. 相機掃條碼：</label>
          <button onclick="alert('請使用條碼槍或手機鏡頭掃描')" class="w-full bg-slate-800 text-white p-2.5 rounded-lg text-sm font-semibold hover:bg-slate-900">開啟相機鏡頭</button>
        </div>
      </div>
    </div>

    <!-- 庫存列表 -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-slate-800">庫存與銷售紀錄</h2>
      <div class="flex gap-2">
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="搜尋書名 / ISBN / 作者..." class="text-xs p-2 border rounded-lg w-48">
        <select id="filterStore" onchange="renderTable()" class="text-xs p-2 border rounded-lg">
          <option value="ALL">全部分店</option>
          <option value="觀塘店">觀塘店</option>
          <option value="旺角店">旺角店</option>
        </select>
      </div>
    </div>

    <div class="overflow-x-auto border rounded-xl">
      <table class="w-full text-left text-xs text-slate-600">
        <thead class="bg-slate-100 text-slate-700 font-bold border-b">
          <tr>
            <th class="p-3 w-16">封面</th>
            <th class="p-3">書名</th>
            <th class="p-3">分店</th>
            <th class="p-3">ISBN</th>
            <th class="p-3">單價</th>
            <th class="p-3">數量</th>
            <th class="p-3">狀態</th>
            <th class="p-3">操作</th>
          </tr>
        </thead>
        <tbody id="bookTableBody" class="divide-y">
          <!-- 動態載入 -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- 📖 進貨確認 Modal (包含相片上傳與新舊書選擇) -->
  <div id="addBookModal" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-lg">✕</button>
      <h3 class="text-lg font-bold text-slate-900 mb-4">📖 確認書籍資訊並進貨</h3>
      
      <form onsubmit="saveBook(event)" class="space-y-4">
        <!-- 封面預覽與自訂上傳 -->
        <div class="flex gap-4 items-center bg-slate-50 p-3 rounded-xl border">
          <img id="modalCoverPreview" src="https://via.placeholder.com/80x110?text=No+Cover" class="w-20 h-28 object-cover rounded shadow border bg-white">
          <div class="flex-1 space-y-2">
            <p class="text-xs text-slate-500 font-semibold">自訂封面相片：</p>
            <label class="inline-block bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded cursor-pointer font-medium">
              📷 選擇/拍攝新相片
              <input type="file" accept="image/*" class="hidden" onchange="previewNewCover(event)">
            </label>
            <p class="text-[10px] text-slate-400">上傳相片將替換預設 OpenLibrary 封面</p>
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">書名：</label>
          <input type="text" id="modalTitle" required class="w-full text-xs p-2.5 border rounded-lg">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600 block mb-1">作者：</label>
          <input type="text" id="modalAuthor" class="w-full text-xs p-2.5 border rounded-lg">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">ISBN：</label>
            <input type="text" id="modalISBN" readonly class="w-full text-xs p-2.5 border rounded-lg bg-slate-100">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">📚 書況 (全新/二手)：</label>
            <select id="modalCondition" class="w-full text-xs p-2.5 border rounded-lg bg-white font-semibold text-blue-600">
              <option value="new">✨ 全新書</option>
              <option value="used">📖 二手書</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">進貨分店：</label>
            <select id="modalStore" class="w-full text-xs p-2.5 border rounded-lg">
              <option value="觀塘店">觀塘店</option>
              <option value="旺角店">旺角店</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">售價 (HKD)：</label>
            <input type="number" id="modalPrice" required min="0" placeholder="70" class="w-full text-xs p-2.5 border rounded-lg">
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">進貨數量：</label>
            <input type="number" id="modalQty" required min="1" value="1" class="w-full text-xs p-2.5 border rounded-lg">
          </div>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-md">
          確認入庫
        </button>
      </form>
    </div>
  </div>

  <script>
    // 🔗 Supabase 配置
    const SUPABASE_URL = "https://gkfudwnkkrabhnmvifop.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrZnVkd25ra3JhYmhubXZpZm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzg5NjAsImV4cCI6MjEwMzc1NDk2MH0.r3cEqVpdR0PD4TFu_2QOhDOqLiwWh5FHUVmpa168Fuk";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allBooks = [];
    let customCoverBase64 = null; // 儲存自訂圖片

    window.onload = loadData;

    async function loadData() {
      const { data, error } = await supabaseClient.from('books').select('*').order('id', { ascending: false });
      if (!error) {
        allBooks = data;
        renderTable();
        updateStats();
      }
    }

    // 1. ISBN 搜尋功能
    async function searchISBN() {
      const isbn = document.getElementById('isbnInput').value.trim();
      if (!isbn) return alert('請輸入 ISBN！');

      customCoverBase64 = null; // 重設自訂封面

      try {
        const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&jscmd=data&format=json`);
        const json = await res.json();
        const bookData = json[`ISBN:${isbn}`];

        let title = '', author = '', coverUrl = '';

        if (bookData) {
          title = bookData.title || '';
          author = bookData.authors ? bookData.authors.map(a => a.name).join(', ') : '';
          coverUrl = bookData.cover ? bookData.cover.large || bookData.cover.medium : '';
        }

        // 填入 Modal 供確認/修改
        document.getElementById('modalTitle').value = title;
        document.getElementById('modalAuthor').value = author;
        document.getElementById('modalISBN').value = isbn;
        document.getElementById('modalPrice').value = '';
        document.getElementById('modalQty').value = 1;
        document.getElementById('modalCondition').value = 'new';
        document.getElementById('modalCoverPreview').src = coverUrl || 'https://via.placeholder.com/80x110?text=無封面';

        document.getElementById('addBookModal').classList.remove('hidden');
      } catch (err) {
        alert('搜尋 ISBN 時發生錯誤');
      }
    }

    // 2. 預覽上傳的新相片
    function previewNewCover(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (evt) {
          customCoverBase64 = evt.target.result;
          document.getElementById('modalCoverPreview').src = customCoverBase64;
        };
        reader.readAsDataURL(file);
      }
    }

    // 3. 儲存進貨資料到 Supabase
    async function saveBook(e) {
      e.preventDefault();

      const finalCover = customCoverBase64 || document.getElementById('modalCoverPreview').src;

      const newBook = {
        title: document.getElementById('modalTitle').value,
        author: document.getElementById('modalAuthor').value,
        isbn: document.getElementById('modalISBN').value,
        store: document.getElementById('modalStore').value,
        price: parseFloat(document.getElementById('modalPrice').value),
        quantity: parseInt(document.getElementById('modalQty').value),
        condition: document.getElementById('modalCondition').value, // 全新 / 二手
        cover_url: finalCover.includes('placeholder') ? '' : finalCover,
        status: 'in_stock'
      };

      const { error } = await supabaseClient.from('books').insert([newBook]);

      if (error) {
        alert('儲存失敗：' + error.message);
      } else {
        alert('✅ 成功進貨！');
        closeModal();
        loadData();
      }
    }

    // 4. 渲染列表 (加強封面顯示與新舊書標籤)
    function renderTable() {
      const tbody = document.getElementById('bookTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const storeFilter = document.getElementById('filterStore').value;

      tbody.innerHTML = '';

      const filtered = allBooks.filter(b => {
        const matchSearch = (b.title || '').toLowerCase().includes(search) || 
                            (b.isbn || '').includes(search) || 
                            (b.author || '').toLowerCase().includes(search);
        const matchStore = storeFilter === 'ALL' || b.store === storeFilter;
        return matchSearch && matchStore;
      });

      filtered.forEach(book => {
        const isUsed = book.condition === 'used';
        const tagCondition = isUsed 
          ? `<span class="bg-amber-100 text-amber-800 text-[10px] px-1.5 py-0.5 rounded font-bold ml-1">二手</span>`
          : `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-1.5 py-0.5 rounded font-bold ml-1">全新</span>`;

        const coverImg = book.cover_url 
          ? `<img src="${book.cover_url}" class="w-10 h-14 object-cover rounded shadow-sm">`
          : `<div class="w-10 h-14 bg-slate-200 rounded flex items-center justify-center text-slate-400 font-bold">?</div>`;

        tbody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-3">${coverImg}</td>
            <td class="p-3 font-semibold text-slate-800">
              ${book.title} ${tagCondition}
              <div class="text-[10px] text-slate-400 font-normal">${book.author || ''}</div>
            </td>
            <td class="p-3">${book.store || '觀塘店'}</td>
            <td class="p-3 font-mono">${book.isbn || '-'}</td>
            <td class="p-3 font-bold text-slate-900">$ ${book.price}</td>
            <td class="p-3 font-bold text-blue-600">${book.quantity} 本</td>
            <td class="p-3">
              <span class="px-2 py-1 text-[10px] rounded-full font-bold ${book.status === 'in_stock' ? 'bg-blue-50 text-blue-600' : 'bg-slate-100 text-slate-500'}">
                ${book.status === 'in_stock' ? '在地庫存' : '已售出'}
              </span>
            </td>
            <td class="p-3 space-x-2">
              <button onclick="sellBook(${book.id}, ${book.quantity})" class="text-blue-600 font-bold hover:underline">賣出</button>
              <button onclick="deleteBook(${book.id})" class="text-rose-500 hover:underline">刪除</button>
            </td>
          </tr>
        `;
      });
    }

    function closeModal() {
      document.getElementById('addBookModal').classList.add('hidden');
    }

    function updateStats() {
      const inStock = allBooks.filter(b => b.status === 'in_stock').reduce((sum, b) => sum + b.quantity, 0);
      document.getElementById('statStock').innerText = `${inStock} 本`;
    }

    async function deleteBook(id) {
      if (confirm('確定要刪除這本書嗎？')) {
        await supabaseClient.from('books').delete().eq('id', id);
        loadData();
      }
    }
  </script>
</body>
</html>
